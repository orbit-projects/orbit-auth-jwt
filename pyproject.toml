[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "orbit-auth-jwt"
version = "0.1.0a1"
description = "PyJWT adapter implementing Orbit Auth token verification contracts."
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = ["orbit-auth>=0.1.0a1,<0.2", "PyJWT>=2.9,<3"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Programming Language :: Python :: 3",
  "Typing :: Typed",
]

[project.optional-dependencies]
asymmetric = ["PyJWT[crypto]>=2.9,<3"]
dev = [
  "pytest>=8,<10",
  "pytest-asyncio>=0.24,<2",
  "ruff>=0.8,<1",
  "mypy>=1.13,<2",
  "PyJWT[crypto]>=2.9,<3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/orbit_auth_jwt"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["orbit_auth_jwt"]
